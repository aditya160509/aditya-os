name: presence keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the presence relay
        run: |
          curl -sS --max-time 60 --retry 3 --retry-delay 10 '${{ vars.PRESENCE_URL || 'https://aditya-presence.onrender.com' }}/healthz'
