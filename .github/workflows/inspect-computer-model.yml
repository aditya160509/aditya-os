name: inspect computer model

on:
  push:
    branches:
      - feat/typefast-keyboard-performance
    paths:
      - .github/workflows/inspect-computer-model.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typefast-keyboard-performance

      - name: Inspect GLB scene metadata
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          path = Path('site/outer/static/models/Computer/computer_setup.glb')
          data = path.read_bytes()
          magic, version, length = struct.unpack_from('<4sII', data, 0)
          assert magic == b'glTF'
          offset = 12
          doc = None
          while offset < length:
              chunk_len, chunk_type = struct.unpack_from('<II', data, offset)
              offset += 8
              chunk = data[offset:offset + chunk_len]
              offset += chunk_len
              if chunk_type == 0x4E4F534A:
                  doc = json.loads(chunk.decode('utf-8').rstrip('\x00 '))
                  break
          assert doc is not None

          rows = []
          for index, node in enumerate(doc.get('nodes', [])):
              mesh_index = node.get('mesh')
              mesh_name = None
              primitives = []
              if mesh_index is not None:
                  mesh = doc.get('meshes', [])[mesh_index]
                  mesh_name = mesh.get('name')
                  for primitive in mesh.get('primitives', []):
                      pos_accessor = primitive.get('attributes', {}).get('POSITION')
                      pos = None
                      if pos_accessor is not None:
                          accessor = doc.get('accessors', [])[pos_accessor]
                          pos = {
                              'min': accessor.get('min'),
                              'max': accessor.get('max'),
                              'count': accessor.get('count'),
                          }
                      primitives.append({'position': pos})
              rows.append({
                  'index': index,
                  'name': node.get('name'),
                  'mesh': mesh_index,
                  'meshName': mesh_name,
                  'translation': node.get('translation'),
                  'rotation': node.get('rotation'),
                  'scale': node.get('scale'),
                  'children': node.get('children'),
                  'primitives': primitives,
              })

          report = {
              'defaultScene': doc.get('scene'),
              'scenes': doc.get('scenes'),
              'nodes': rows,
              'meshCount': len(doc.get('meshes', [])),
              'extensionsUsed': doc.get('extensionsUsed', []),
          }
          out = Path('computer-model-inspection.json')
          out.write_text(json.dumps(report, indent=2), encoding='utf-8')
          PY

      - name: Commit inspection report and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/inspect-computer-model.yml
          git add computer-model-inspection.json
          git commit -m 'chore: capture computer model inspection'
          git push
