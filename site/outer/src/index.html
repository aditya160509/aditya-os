<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Aditya Balaji — Builder &amp; Researcher</title>
  <meta name="title" content="Aditya Balaji — Builder &amp; Researcher">
  <meta name="description"
    content="Aditya Balaji builds research-driven systems across AI, quantitative finance, economics, and software.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aditya-os.vercel.app/">
  <meta property="og:title" content="Aditya Balaji — Builder &amp; Researcher">
  <meta property="og:description"
    content="Aditya Balaji builds research-driven systems across AI, quantitative finance, economics, and software.">

  <!-- Twitter -->


  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">

  <meta property="twitter:url" content="https://aditya-os.vercel.app/">
  <meta name="twitter:url" content="https://aditya-os.vercel.app/">

  <meta property="twitter:title" content="Aditya Balaji — Builder &amp; Researcher">
  <meta name="twitter:title" content="Aditya Balaji — Builder &amp; Researcher">

  <meta property="twitter:description"
    content="Aditya Balaji builds research-driven systems across AI, quantitative finance, economics, and software.">
  <meta name="twitter:description"
    content="Aditya Balaji builds research-driven systems across AI, quantitative finance, economics, and software.">

  <meta property="twitter:image" content="https://aditya-os.vercel.app/images/preview-new.jpg">
  <meta name="twitter:image" content="https://aditya-os.vercel.app/images/preview-new.jpg">

  <!-- Images -->
  <meta property="og:image" content="https://aditya-os.vercel.app/images/preview-new.jpg">
  <meta property="og:image:secure" content="https://aditya-os.vercel.app/images/preview-new.jpg">

  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AdityaOS">
  <script>
    // Installable app: the worker only takes the shell offline — the 3D scene
    // and wallpaper library stay on the network.
    // The manifest link is injected here rather than written as a tag: the
    // HTML loader would try to resolve the absolute path as a bundled module.
    (function () {
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = '/manifest.webmanifest';
      document.head.appendChild(link);
      var apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = '/images/apple-touch-icon.png';
      document.head.appendChild(apple);
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">

</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
